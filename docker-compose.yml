services:
  pi_agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pi_agent
    volumes:
      - .:/app
    working_dir: /app
    # 터미널 접속 및 백그라운드 유지를 위한 설정
    tty: true
    stdin_open: true
    command: tail -f /dev/null
    # .env 파일로 환경 변수 주입
    env_file:
      - .env
    environment:
      # Keep Python's text streams in UTF-8 when attached through Docker Desktop.
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
      # Docker Desktop reaches the already-running host Markdown Search MCP here.
      PI_MARKDOWN_SEARCH_MCP_URL: ${PI_MARKDOWN_SEARCH_MCP_URL:-http://host.docker.internal:8811/mcp}
